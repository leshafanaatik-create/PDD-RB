name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare generated image assets
        run: |
          for f in app/src/main/res/drawable/*.b64; do
            [ -e "$f" ] || continue
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm "$f"
          done
      - name: Build unsigned release
        run: gradle :app:assembleRelease
      - name: Align and sign release APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/pdd-release.jks" -storepass "$PASS" -alias pddrb -keypass "$PASS" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=PDD RB Denis Edition,O=Fanatik Apps,C=BY"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/pdd-release.jks" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias pddrb --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out PDD-RB-v0.7.1-release.apk "$RUNNER_TEMP/aligned.apk"
      - name: Validate release APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -c -v 4 PDD-RB-v0.7.1-release.apk
          "$BT/apksigner" verify --verbose --print-certs PDD-RB-v0.7.1-release.apk
          "$BT/aapt" dump badging PDD-RB-v0.7.1-release.apk | head -20
          unzip -t PDD-RB-v0.7.1-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDD-RB-v0.7.1-release
          path: PDD-RB-v0.7.1-release.apk
          retention-days: 14
