name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare fixed debug signing key
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Validate installable APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$BT/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PDD-RB-v0.7.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PDD-RB-v0.7.0
          path: PDD-RB-v0.7.0.apk
          retention-days: 14
